<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Hackathon Judging</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <div class="brand-mark">HD</div>
      <div>
        <div class="brand-title" id="eventName">Hack Days Solan 2026</div>
        <div class="brand-sub">Enkindle Club · JUIT Solan · Judging Portal</div>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="muted">Use the credentials provided by the organising team.</p>
    <form id="loginForm" autocomplete="on" novalidate>
      <label class="field">
        <span>Username</span>
        <input name="username" type="text" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <div id="loginError" class="form-error" hidden></div>
      <button class="btn primary block" type="submit" id="loginBtn">Sign in</button>
    </form>
    <p class="muted small center" style="margin-top:20px">Judges see only the teams assigned to them. All activity is logged.</p>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
