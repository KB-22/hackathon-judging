# Render blueprint. Import the repo at render.com and it picks this up, or set
# the same values by hand under Environment.
#
# DB_DRIVER must be postgres: Render's container disk is wiped on every deploy
# and idle spin-down, so SQLite would start empty and lose judging scores.
services:
  - type: web
    name: hackathon-judging
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_DRIVER
        value: postgres
      # Set these three in the Render dashboard - never commit them.
      - key: SUPABASE_DB_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        value: admin
